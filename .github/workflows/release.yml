name: Release research source

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer used for a package-only dry run (vMAJOR.MINOR.PATCH)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Reuse CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Build audited source bundle
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve and validate version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${DISPATCH_VERSION}"
          fi
          if [[ ! "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use exact syntax vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag belongs to main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Build release assets
        run: >-
          python scripts/ci/build_release_bundle.py
          --version "${{ steps.version.outputs.value }}"
          --output-dir release-dist

      - name: Upload reviewed assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-source-${{ steps.version.outputs.value }}
          path: |
            release-dist/*.zip
            release-dist/release-manifest.json
            release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-draft:
    name: Create or refresh draft release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download reviewed assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: research-source-${{ needs.package.outputs.version }}
          path: release-dist

      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "Refusing to replace an already published release." >&2
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" release-dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-dist/* \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
