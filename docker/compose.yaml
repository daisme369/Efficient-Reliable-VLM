# Thorax AI on one server: caddy (HTTPS, ports 80/443) -> web (Next.js) -> api (FastAPI + SQLite).
# Usage and settings: docker/README.md, "Deploy the app".
name: thorax

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      THORAX_DOMAIN: ${THORAX_DOMAIN:?Set THORAX_DOMAIN in docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      THORAX_WEB_ORIGINS: https://${THORAX_DOMAIN:?Set THORAX_DOMAIN in docker/.env}
      # The API port is not published: only web and caddy can reach it, so their X-Forwarded-For is trusted.
      THORAX_TRUST_PROXY: "1"
      # Empty: SQLite on the thorax-data volume. On AWS: postgresql://…@<RDS endpoint>:5432/thorax?sslmode=require
      THORAX_DATABASE_URL: ${THORAX_DATABASE_URL:-}
      # Model served by vLLM (docker/DEPLOY.md, "Model server"); all empty: fixed demo answers.
      THORAX_VLM_URL: ${THORAX_VLM_URL:-}
      THORAX_VLM_KEY: ${THORAX_VLM_KEY:-}
      THORAX_VLM_MODEL: ${THORAX_VLM_MODEL:-thorax-m1}
      THORAX_VLM_CALIBRATION: ${THORAX_VLM_CALIBRATION:-}
    volumes:
      - thorax-data:/data
      - ./calibration:/calibration:ro  # M1 metrics.json for calibrated abstention; empty folder when unused

volumes:
  thorax-data:
  caddy-data:
  caddy-config:
